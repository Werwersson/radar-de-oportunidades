<!DOCTYPE html>
<html lang="pt-BR">

</head>
<body class="bg-slate-50 text-[#0d141c]">
    <div class="relative flex flex-col min-h-screen overflow-x-hidden">
        
        <header class="relative flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#e7edf4] px-4 md:px-10 py-3">
            <div class="flex items-center gap-4 md:gap-8"><a href="index.html" class="flex items-center gap-3 md:gap-4 text-[#0d141c]"><div class="size-4"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M42.4379 44C42.4379 44 36.0744 33.9038 41.1692 24C46.8624 12.9336 42.2078 4 42.2078 4L7.01134 4C7.01134 4 11.6577 12.932 5.96912 23.9969C0.876273 33.9029 7.27094 44 7.27094 44L42.4379 44Z" fill="currentColor"></path></svg></div><h2 class="text-base md:text-lg font-bold">Oportunidades Itabuna</h2></a><nav class="hidden md:flex items-center gap-9"><a class="text-sm font-medium" href="vagas.html">Vagas</a><a class="text-sm font-medium" href="cursos.html">Cursos</a><a class="text-sm font-medium" href="dicas.html">Dicas</a></nav></div><div class="flex items-center gap-2"><button class="btn-azul hidden sm:flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 text-slate-50 text-sm font-bold"><span class="truncate">Cadastre-se</span></button><button class="hidden sm:flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-[#e7edf4] text-[#0d141c] text-sm font-bold"><span class="truncate">Entrar</span></button><button id="menu-button" class="md:hidden p-2 rounded-md text-gray-600 hover:bg-gray-100"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,88H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"></path></svg></button></div><div id="mobile-menu" class="hidden absolute top-16 right-4 w-48 bg-white rounded-lg shadow-lg border border-slate-200 z-50"><nav class="flex flex-col p-2"><a class="p-2 rounded-md text-sm font-medium hover:bg-slate-100" href="vagas.html">Vagas</a><a class="p-2 rounded-md text-sm font-medium hover:bg-slate-100" href="cursos.html">Cursos</a><a class="p-2 rounded-md text-sm font-medium hover:bg-slate-100" href="dicas.html">Dicas</a><a class="p-2 rounded-md text-sm font-medium hover:bg-slate-100" href="contato.html">Contato</a><hr class="my-2 sm:hidden"><a class="p-2 rounded-md text-sm font-medium sm:hidden hover:bg-slate-100" href="#">Cadastre-se</a><a class="p-2 rounded-md text-sm font-medium sm:hidden hover:bg-slate-100" href="#">Entrar</a></nav></div>
        </header>

        <main class="px-4 md:px-10 lg:px-40 flex-1 justify-center py-5">
            <div class="flex flex-col max-w-[960px] mx-auto">
                <h1 class="text-2xl md:text-3xl font-bold p-4">Vagas Disponíveis em Itabuna</h1>
                <div class="px-4 py-3">
                    <div class="flex w-full max-w-lg mx-auto">
                        <input id="vagas-search-input" placeholder="Pesquisar por cargo ou empresa..." class="form-input flex w-full min-w-0 flex-1 rounded-lg text-[#0d141c] focus:outline-0 h-12 p-4 text-base border border-slate-300">
                    </div>
                </div>
                <div class="px-4 py-3">
                    <div class="overflow-x-auto rounded-lg border border-[#e7edf4] bg-white">
                        <table class="w-full min-w-[600px]">
                            <thead class="bg-slate-100">
                                <tr>
                                    <th class="px-4 py-3 text-left text-sm font-medium">Cargo</th>
                                    <th class="px-4 py-3 text-left text-sm font-medium">Empresa</th>
                                    <th class="px-4 py-3 text-left text-sm font-medium">Tipo</th>
                                </tr>
                            </thead>
                            <tbody id="vagas-table-body">
                                <tr class="border-t hover:bg-slate-50 filterable-row">...</tr>
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer class="flex justify-center border-t border-solid border-t-[#e7edf4] mt-10">
            <div class="flex max-w-[960px] flex-1 flex-col px-5 py-10 text-center"><p class="text-[#49739c] text-base font-normal leading-normal">© 2025 Oportunidades Itabuna. Todos os direitos reservados.</p></div>
        </footer>
    </div>

    <button id="open-duvidas-btn" class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-blue-600 text-white shadow-lg transition-transform hover:scale-110">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-8 w-8"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" /></svg>
    </button>
    <div id="duvidas-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-hidden">
        <div id="modal-overlay" class="absolute inset-0 bg-black bg-opacity-60"></div>
        <div id="modal-content" class="relative z-10 w-11/12 max-w-lg rounded-lg bg-white p-6 shadow-xl">
            <button id="close-duvidas-btn" class="absolute -top-2 -right-2 flex h-8 w-8 items-center justify-center rounded-full bg-slate-600 text-white hover:bg-slate-800">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <h2 class="text-2xl font-bold mb-4">Tem alguma dúvida?</h2><p class="text-slate-600 mb-4">Pergunte o que quiser sobre carreiras, currículos ou entrevistas.</p><div class="flex flex-col gap-4"><textarea id="modal-duvidas-input" rows="4" placeholder="Ex: Como posso me destacar em uma entrevista?" class="form-input w-full rounded-lg text-[#0d141c] focus:outline-0 p-4 border border-slate-300"></textarea><button id="modal-duvidas-button" class="btn-azul min-w-[120px] cursor-pointer self-start items-center justify-center rounded-lg h-12 px-6 text-slate-50 font-bold"><span class="truncate">Enviar Pergunta</span></button><div id="modal-duvidas-resposta" class="mt-4 p-4 bg-slate-50 border border-slate-200 rounded-lg min-h-[100px]"></div></div>
        </div>
    </div>
    
    <script src="public/js/main.js" defer></script>
    <script src="public/js/vagas.js" defer></script>
